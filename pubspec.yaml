name: ethiocode
description: An offline-first mobile IDE for high school students in Ethiopia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView renderer for offline HTML/CSS/JS preview
  webview_flutter: ^4.13.1

  # Local SQLite database – projects, snapshots, curriculum_progress
  sqflite: ^2.4.2+1

  # Resolve device-local document & support directories for the DB file
  path_provider: ^2.1.5

  # Lightweight path manipulation used by DatabaseHelper
  path: ^1.9.0
  sqflite_common_ffi: ^2.4.1
  file_picker: 10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Offline curriculum definition bundled with the APK
  assets:
    - assets/curriculum/roadmap.json
